# ============================================================================
# docker-compose.yml — AbogadoSoft
#
# Servicios de infraestructura para desarrollo local.
# Estándar Docker Compose v3: compatible con Docker Desktop, Colima + Docker CLI,
# Podman, Rancher Desktop, o cualquier entorno dockerizado en producción.
#
# Desarrollo local con Colima:
#   colima start          # (solo si no está corriendo)
#   docker compose up -d meilisearch
#
# Producción / CI: docker compose up -d meilisearch (mismo comando)
# ============================================================================

services:
  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: abogadosoft-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:-masterKey123}
      MEILI_ENV: ${MEILI_ENV:-development}
      # En producción: MEILI_ENV=production
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  meilisearch_data:
    driver: local
