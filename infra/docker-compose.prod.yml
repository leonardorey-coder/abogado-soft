# ==============================================================================
# infra/docker-compose.prod.yml — App Stack (Backend + Nginx + Meilisearch + DB)
#
# Uso:
#   cd infra
#   docker compose -f docker-compose.prod.yml up -d
# ==============================================================================

name: abogadosoft

services:

  # ─── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    container_name: abogadosoft_db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: abogadosoft
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d abogadosoft"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Backend Express/Bun ─────────────────────────────────────────────────────
  backend:
    container_name: abogadosoft_backend
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env.prod
    environment:
      PORT: 4001
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks:
      - app_network
    volumes:
      # Credencial Google Service Account (debe existir en el servidor):
      - ../backend/abogadosoft-service-account.json:/app/abogadosoft-service-account.json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ─── Frontend (Nginx + Vite dist/) ───────────────────────────────────────────
  frontend:
    container_name: abogadosoft_frontend
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/locations.conf:/etc/nginx/conf.d/locations.conf:ro
      # TLS (descomentar cuando haya cert):
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── Meilisearch ─────────────────────────────────────────────────────────────
  # Expuesto en localhost (7700) para healthchecks/debug; el backend usa http://meilisearch:7700.
  #
  # Para deshabilitar Meilisearch y usar el buscador interno (Prisma/PostgreSQL):
  #   1. Comentar o eliminar este servicio y el depends_on en `backend`.
  #   2. En .env.prod: SEARCH_ENGINE=prisma  (y borrar MEILISEARCH_HOST/KEY).
  #   No se requieren cambios en el código — SearchServiceFactory lo resuelve.
  meilisearch:
    container_name: abogadosoft_meilisearch
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY}
      MEILI_ENV: production
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    # Expuesto solo en localhost (healthcheck / debug). No queda abierto a la red.
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  meilisearch_data:
