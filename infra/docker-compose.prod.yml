# ==============================================================================
# infra/docker-compose.prod.yml — App Stack (Backend + Nginx + Meilisearch + DB)
#
# Uso:
#   cd infra
#   docker compose -f docker-compose.prod.yml up -d
# ==============================================================================

name: abogadosoft

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ─── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    container_name: abogadosoft_db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: abogadosoft
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    security_opt:
      - no-new-privileges:true
    cpus: "1.0"
    mem_limit: 768m
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d abogadosoft"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Backend Express/Bun ─────────────────────────────────────────────────────
  backend:
    container_name: abogadosoft_backend
    image: ghcr.io/leonardorey-coder/sidoc-backend:${SIDOC_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ../.env.prod
    environment:
      PORT: 4001
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    ports:
      - "127.0.0.1:4001:4001"
    networks:
      - app_network
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: "1.0"
    mem_limit: 768m
    tmpfs:
      - /tmp:size=256m,mode=1777
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          memory: 256M
    healthcheck:
      # oven/bun:alpine no incluye curl; wget sí. Usar 127.0.0.1 evita ::1/IPv6.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ─── Migraciones Prisma (tooling separado del backend runtime) ──────────────
  migrate:
    image: ghcr.io/leonardorey-coder/sidoc-migrator:${SIDOC_IMAGE_TAG:-latest}
    profiles:
      - tools
    env_file:
      - ../.env.prod
    environment:
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: "0.5"
    mem_limit: 384m
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
        reservations:
          memory: 128M

  # ─── Frontend (Nginx + Vite dist/) ───────────────────────────────────────────
  frontend:
    container_name: abogadosoft_frontend
    image: ghcr.io/leonardorey-coder/sidoc-frontend:${SIDOC_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_network
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m,mode=0755
      - /var/run:size=16m,mode=0755
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cpus: "0.5"
    mem_limit: 128m
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          memory: 32M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ─── Meilisearch ─────────────────────────────────────────────────────────────
  # Expuesto en localhost (7700) para healthchecks/debug; el backend usa http://meilisearch:7700.
  #
  # Para deshabilitar Meilisearch y usar el buscador interno (Prisma/PostgreSQL):
  #   1. Comentar o eliminar este servicio y el depends_on en `backend`.
  #   2. En .env.prod: SEARCH_ENGINE=prisma  (y borrar MEILISEARCH_HOST/KEY).
  #   No se requieren cambios en el código — SearchServiceFactory lo resuelve.
  meilisearch:
    container_name: abogadosoft_meilisearch
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY}
      MEILI_ENV: production
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    # Expuesto solo en localhost (healthcheck / debug). No queda abierto a la red.
    networks:
      - app_network
    security_opt:
      - no-new-privileges:true
    cpus: "1.0"
    mem_limit: 512m
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  meilisearch_data:
