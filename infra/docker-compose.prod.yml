# ==============================================================================
# infra/docker-compose.prod.yml — App Stack (Backend + Nginx + Meilisearch)
#
# Uso:
#   cd infra
#   docker compose -f docker-compose.prod.yml up -d
# ==============================================================================

name: abogadosoft

services:

  # ─── PostgreSQL Self-Hosted ───────────────────────────────────────────────────
  db:
    container_name: abogadosoft_db
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: abogadosoft
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d abogadosoft"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Backend Express/Bun ─────────────────────────────────────────────────────
  backend:
    container_name: abogadosoft_backend
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PORT: 4001
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/abogadosoft?schema=public
      DIRECT_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/abogadosoft?schema=public
      MEILISEARCH_HOST: http://meilisearch:7700
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks:
      - app_network
    volumes:
      - backend_storage:/app/storage/documents
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ─── Frontend (Nginx + Vite dist/) ───────────────────────────────────────────
  frontend:
    container_name: abogadosoft_frontend
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/locations.conf:/etc/nginx/conf.d/locations.conf:ro
      # TLS (descomentar cuando haya cert):
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── Meilisearch ─────────────────────────────────────────────────────────────
  # Puerto 7700 NO expuesto al host — solo accesible dentro de la red Docker.
  # El backend lo alcanza en http://meilisearch:7700 (MEILISEARCH_HOST en .env).
  #
  # Para deshabilitar Meilisearch y usar el buscador interno (Prisma/PostgreSQL):
  #   1. Comentar o eliminar este servicio y el depends_on en `backend`.
  #   2. En .env: SEARCH_ENGINE=prisma  (y borrar MEILISEARCH_HOST/KEY).
  #   No se requieren cambios en el código — SearchServiceFactory lo resuelve.
  meilisearch:
    container_name: abogadosoft_meilisearch
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY}
      MEILI_ENV: production
    volumes:
      - meilisearch_data:/meili_data
    # Sin ports: → solo red interna Docker. No accesible desde fuera del servidor.
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  backend_storage:
  meilisearch_data:
