# ==============================================================================
# infra/nginx/nginx.conf — AbogadoSoft reverse proxy
# Sirve el frontend estático y hace proxy al backend.
# ==============================================================================

upstream backend {
    server backend:4001;
}

# ─── HTTP (redirige a HTTPS si TLS está activo) ───────────────────────────────
server {
    listen 80;
    server_name _;

    # Descomentar cuando haya cert TLS para redirigir:
    # return 301 https://$host$request_uri;

    include /etc/nginx/conf.d/locations.conf;
}

