# ==============================================================================
# infra/nginx/nginx.conf — AbogadoSoft reverse proxy
# Sirve el frontend estático y hace proxy al backend.
# ==============================================================================

upstream backend {
    server backend:4001;
}

# ─── HTTP (redirige a HTTPS si TLS está activo) ───────────────────────────────
server {
    listen 80;
    server_name _;

    # Descomentar cuando haya cert TLS para redirigir:
    # return 301 https://$host$request_uri;

    # Frontend estático (Vite build en dist/)
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── API Backend ──────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 55M;
    }

    # ─── Headers de seguridad ─────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "strict-origin" always;
}

