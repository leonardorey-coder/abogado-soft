# Incluido tanto por el bloque HTTP como HTTPS
# ==============================================================================

# Frontend estático (Vite build en dist/)
root /usr/share/nginx/html;
index index.html;

# SPA fallback
location / {
    try_files $uri $uri/ /index.html;
}

# ─── API Backend ──────────────────────────────────────────────────────────────
location /api/ {
    proxy_pass         http://backend;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 55M;
}

# ─── Supabase Realtime WebSockets ─────────────────────────────────────────────
# El frontend se conecta a /realtime/v1/websocket para colaboración en tiempo real
location /realtime/ {
    proxy_pass         http://supabase_realtime;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_set_header   Host       $host;
    proxy_read_timeout 86400s;
}

# ─── Supabase Auth (directo al Kong) ─────────────────────────────────────────
# Solo si el frontend llama directamente a auth en vez de pasar por el backend
location /auth/ {
    proxy_pass         http://supabase_kong:8000;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
}

# ─── Headers de seguridad ─────────────────────────────────────────────────────
add_header X-Frame-Options        "SAMEORIGIN"   always;
add_header X-Content-Type-Options "nosniff"      always;
add_header Referrer-Policy        "strict-origin" always;
